# Regenerate the Xcode project with: xcodegen generate --spec project.yml
name: ShowcaseApp
options:
  bundleIdPrefix: io.github.muhittincamdali
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
packages:
  SwiftUIiOS26Showcase:
    path: ../..
targets:
  ShowcaseApp:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - Sources
    dependencies:
      - package: SwiftUIiOS26Showcase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.muhittincamdali.ShowcaseApp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: iOS 26 Showcase
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
    scheme: {}

name: Bug report
description: A demo crashes, shows the wrong thing, or the package does not build
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Glass Effect demo
        2. Select the Clear variant
        3. ...
    validations:
      required: true

  - type: input
    id: demo
    attributes:
      label: Demo
      description: The demo's title as shown in the gallery, if the bug is in a demo.
      placeholder: "e.g. Morphing Glass"

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - iOS device
        - iOS Simulator
        - macOS
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: OS and Xcode versions
      placeholder: "e.g. iOS 26.1, Xcode 26.1"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Build errors or console output
      render: shell

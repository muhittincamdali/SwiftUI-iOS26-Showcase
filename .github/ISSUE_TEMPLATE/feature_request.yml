name: Demo request
description: Suggest an iOS 26 or macOS 26 API that deserves a demo, or an improvement to an existing one
title: "[Demo]: "
labels: ["enhancement"]
body:
  - type: input
    id: api
    attributes:
      label: API
      description: The SDK symbol or framework, as written in code.
      placeholder: "e.g. glassEffect(_:in:)"
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What the demo should show
      description: Which options or behaviours should the screen let people try?
    validations:
      required: true

  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      multiple: true
      options:
        - iOS
        - macOS

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this
